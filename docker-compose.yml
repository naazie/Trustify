version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: trustify_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trustify
    networks:
      - trustify_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustify_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WORKSPACE_DIR=/tmp/trustify_workspaces
      - ENVIRONMENT=development
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - /tmp/trustify_workspaces:/tmp/trustify_workspaces
      - ./backend:/app
    depends_on:
      - mongodb
    networks:
      - trustify_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustify_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trustify_net

volumes:
  mongo_data:
  workspace_data:

networks:
  trustify_net:
    driver: bridge
